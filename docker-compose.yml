services:
  caddy:
    image: caddy:2-alpine
    # Share the backend's loopback so Uvicorn trusts this proxy without trusting the bridge network.
    network_mode: service:backend
    environment:
      EIDOLON_DOMAIN: http://:3000
      EIDOLON_FRONTEND_UPSTREAM: frontend:3000
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - eidolon-data:/data
    # 本机的代理在容器里叫 host.docker.internal（容器里的 127.0.0.1 是容器自己）；
    # Docker Desktop 本来就有，Linux 靠这一行
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_EIDOLON_SOURCE_URL: ${NEXT_PUBLIC_EIDOLON_SOURCE_URL:-}
    environment:
      BACKEND_URL: http://backend:8000
      EIDOLON_STAND_ASSETS_URL: ${EIDOLON_STAND_ASSETS_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eidolon-data:
