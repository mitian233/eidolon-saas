services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - eidolon-data:/data
    # 本机的代理在容器里叫 host.docker.internal（容器里的 127.0.0.1 是容器自己）；
    # Docker Desktop 本来就有，Linux 靠这一行
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      EIDOLON_STAND_ASSETS_URL: ${EIDOLON_STAND_ASSETS_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eidolon-data:
